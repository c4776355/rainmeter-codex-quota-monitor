name: Build Rainmeter package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build release package
        shell: powershell
        run: .\Build-Release.ps1 -Version 1.4.1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexQuotaOptions-1.4.1
          path: |
            dist/*.rmskin
            dist/SHA256SUMS.txt

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist/*.rmskin dist/SHA256SUMS.txt --verify-tag --generate-notes
