[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,1
OnRefreshAction=[!SetVariable StatusText "SYNCING"][!SetVariable StatusColor "#ColorSync#"][!UpdateMeterGroup Dynamic][!Redraw][!CommandMeasure MeasureQuotaCommand "Run"]
ContextTitle=Edit all three concepts
ContextAction=["notepad.exe" "#@#Variables.inc"]
ContextTitle2=Refresh quota now
ContextAction2=[!CommandMeasure MeasureQuotaCommand "Run"]
ContextTitle3=Open concept folder
ContextAction3=["explorer.exe" "#CURRENTPATH#"]

[Metadata]
Name=Codex Quota - Aurora Pulse
Author=Codex Quota Monitor contributors
Information=Compact centered concept with layered aurora light and pulse lines.
Version=1.2.0
License=MIT

[Variables]
@Include=#@#Variables.inc
QuotaRemaining=0
QuotaRemainingDisplay=--
QuotaUsed=--
QuotaWindow=--
QuotaReset=--
QuotaCountdown=WAITING
QuotaPlan=--
QuotaCredits=--
QuotaLimitId=CODEX
QuotaAux=PRIMARY LIMIT
LastUpdated=--:--:--
StatusText=STARTING
StatusColor=#ColorSync#
ProgressWidth=0
ProgressMaxWidth=264
ActiveAccentA=#AuroraAccentA#
ActiveAccentB=#AuroraAccentB#
ProgressColorA=#AuroraAccentA#
ProgressColorB=#AuroraAccentB#
ErrorText=

[MeasureQuotaCommand]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "#@#Scripts\Get-CodexQuota.ps1" -TimeoutMs #CommandTimeoutMs#
State=Hide
OutputType=UTF8
Timeout=(#CommandTimeoutMs#+3000)
FinishAction=[!CommandMeasure MeasureQuotaParser "Parse()"]
UpdateDivider=-1
DynamicVariables=1

[MeasureQuotaParser]
Measure=Script
ScriptFile=#@#Scripts\ParseQuota.lua
UpdateDivider=-1

[MeasureAutoRefresh]
Measure=Calc
Formula=Counter
IfCondition=(MeasureAutoRefresh > 0) && ((MeasureAutoRefresh % #RefreshSeconds#) = 0)
IfTrueAction=[!CommandMeasure MeasureQuotaCommand "Run"]
DynamicVariables=1

[MeterCard]
Meter=Shape
X=0
Y=0
Shape=Rectangle 1,1,302,182,17 | Fill LinearGradient CardGradient | Stroke LinearGradient EdgeGradient | StrokeWidth 1.2
Shape2=Rectangle 7,7,290,170,13 | Fill Color 7,27,76,48 | Stroke Color #AuroraInner# | StrokeWidth 1
Shape3=Ellipse 87,30,116,78 | Fill RadialGradient GlowA | StrokeWidth 0
Shape4=Ellipse 239,128,96,62 | Fill RadialGradient GlowB | StrokeWidth 0
Shape5=Ellipse 42,146,74,42 | Fill RadialGradient GlowC | StrokeWidth 0
CardGradient=28 | #AuroraBackgroundA# ; 0.0 | #AuroraBackgroundB# ; 0.50 | #AuroraBackgroundC# ; 1.0
EdgeGradient=150 | #AuroraAccentA# ; 0.0 | #AuroraAccentB# ; 0.50 | #AuroraAccentC# ; 1.0
GlowA=0,0 | #AuroraGlowA# ; 0.0 | 61,185,255,0 ; 1.0
GlowB=0,0 | #AuroraGlowB# ; 0.0 | 122,96,255,0 ; 1.0
GlowC=0,0 | 72,210,255,54 ; 0.0 | 38,151,255,0 ; 1.0
AntiAlias=1
DynamicVariables=1

[MeterAuroraLines]
Meter=Shape
X=0
Y=0
Shape=Line 9,91,58,61 | Stroke LinearGradient BeamGradient | StrokeWidth 1
Shape2=Line 58,61,107,82 | Stroke LinearGradient BeamGradient | StrokeWidth 1
Shape3=Line 107,82,157,45 | Stroke LinearGradient BeamGradient | StrokeWidth 1
Shape4=Line 157,45,210,72 | Stroke LinearGradient BeamGradient | StrokeWidth 1
Shape5=Line 210,72,295,35 | Stroke LinearGradient BeamGradient | StrokeWidth 1
Shape6=Ellipse 58,61,2,2 | Fill Color #AuroraAccentA# | StrokeWidth 0
Shape7=Ellipse 157,45,2,2 | Fill Color #AuroraAccentC# | StrokeWidth 0
Shape8=Ellipse 210,72,2,2 | Fill Color #AuroraAccentB# | StrokeWidth 0
Shape9=Line 18,31,94,31 | Stroke Color #AuroraGridFaint# | StrokeWidth 1
Shape10=Line 210,31,286,31 | Stroke Color #AuroraGridFaint# | StrokeWidth 1
Shape11=Line 18,159,56,159 | Stroke Color #AuroraGrid# | StrokeWidth 1
Shape12=Line 248,159,286,159 | Stroke Color #AuroraGrid# | StrokeWidth 1
BeamGradient=180 | #AuroraAccentA# ; 0.0 | #AuroraAccentC# ; 0.52 | #AuroraAccentB# ; 1.0
AntiAlias=1
DynamicVariables=1

[MeterTitle]
Meter=String
X=18
Y=13
FontFace=#FontText#
FontSize=8
FontWeight=600
FontColor=#ColorTextPrimary#
CharacterSpacing=0.8
StringCase=Upper
AntiAlias=1
Text=#TitleText#  /  AURORA
DynamicVariables=1

[MeterStatusDot]
Meter=Shape
X=0
Y=0
Shape=Ellipse 225,20,3,3 | Fill Color #StatusColor# | StrokeWidth 0
