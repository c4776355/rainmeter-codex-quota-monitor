[Rainmeter]
Update=100
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,1
OnRefreshAction=[!SetVariable StatusText "STARTING"][!SetVariable StatusColor "#ColorSync#"][!CommandMeasure MeasureAgentLauncher "Run"][!UpdateMeasure MeasurePanelController][!UpdateMeasure MeasureZPositionController][!UpdateMeterGroup Dynamic][!Redraw]
OnCloseAction=[!CommandMeasure MeasureAgentStop "Run"]
ContextTitle=Edit dynamic panel settings
ContextAction=["notepad.exe" "#@#Variables.inc"]
ContextTitle2=Refresh quota now
ContextAction2=[!SetVariable StatusText "SYNCING"][!SetVariable StatusColor "#ColorSync#"][!CommandMeasure MeasureAgentLauncher "Run"][!CommandMeasure MeasureManualSync "Run"]
ContextTitle3=Open editable skin folder
ContextAction3=["explorer.exe" "#ROOTCONFIGPATH#"]
ContextTitle4=Toggle panel always on top
ContextAction4=[!CommandMeasure MeasureZPositionController "Toggle()"]

[Metadata]
Name=Codex Quota - Dynamic Glacier
Author=Codex Quota Monitor contributors
Information=Task-aware quota panel with a highlighted reset cycle, 20-second active countdown, silent idle mode, full-edge breathing light, and an in-panel topmost toggle.
Version=1.4.1
License=MIT

[Variables]
@Include=#@#Variables.inc
QuotaRemaining=0
QuotaRemainingDisplay=--
QuotaUsed=--
QuotaWindow=--
QuotaReset=--
QuotaResetDate=--
QuotaResetTime=--:--
QuotaCountdown=--
QuotaPlan=--
QuotaCredits=--
QuotaLimitId=CODEX
QuotaAux=PRIMARY LIMIT
LastUpdated=--:--:--
StatusText=STARTING
StatusDetail=SCANNING TASKS
StatusColor=#ColorSync#
SyncLabel=MONITOR LINK
SyncCountdown=BOOT
ProgressWidth=0
ProgressMaxWidth=338
ActiveAccentA=#GlacierAccentA#
ActiveAccentB=#GlacierAccentB#
ProgressColorA=#GlacierAccentA#
ProgressColorB=#GlacierAccentB#
PulseColor=168,216,255
PulseMin=20
PulseRange=0
PulseSoftMin=8
PulseSoftRange=0
PanelWashMin=0
PanelWashRange=0
PulseRadiusBase=5.4
PulseRadiusRange=0
ScanAlpha=0
ZPositionLabel=TOP OFF
ZPositionTextColor=164,221,243,242
ZPositionFill=5,42,88,118
ZPositionOutline=128,190,220,90
ZPositionTip=TOP OFF - other apps and fullscreen games can cover this panel
ErrorText=

; --- Background agent -------------------------------------------------------

[MeasureAgentLauncher]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "#@#Scripts\Start-CodexQuotaAgent.ps1" -AgentPath "#@#Scripts\CodexQuotaAgent.cs" -StatePath "#@#Data\DynamicState.ini" -StopTokenPath "#@#Data\Stop.token" -SyncTokenPath "#@#Data\Sync.token" -ActiveIntervalSeconds #ActiveRefreshSeconds# -TimeoutMs #CommandTimeoutMs#
State=Hide
OutputType=UTF8
Timeout=6000
UpdateDivider=-1
DynamicVariables=1

[MeasureAgentStop]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "#@#Scripts\Stop-CodexQuotaAgent.ps1" -StopTokenPath "#@#Data\Stop.token"
State=Hide
OutputType=UTF8
Timeout=3000
UpdateDivider=-1

[MeasureManualSync]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "#@#Scripts\Request-CodexQuotaSync.ps1" -SyncTokenPath "#@#Data\Sync.token"
State=Hide
OutputType=UTF8
Timeout=3000
UpdateDivider=-1
FinishAction=[!UpdateMeasure MeasurePanelController][!UpdateMeterGroup Dynamic][!Redraw]

[MeasurePanelController]
Measure=Script
ScriptFile=#@#Scripts\DynamicPanel.lua
StateFile=#@#Data\DynamicState.ini
UpdateDivider=10

[MeasureZPositionController]
Measure=Script
ScriptFile=#@#Scripts\ZPositionController.lua
UpdateDivider=10

; --- Active-only animation --------------------------------------------------

[MeasureBreathAlpha]
Measure=Calc
Formula=Round(#PulseMin#+#PulseRange#*((Sin(Counter/12)+1)/2))
DynamicVariables=1

[MeasureBreathSoftAlpha]
Measure=Calc
Formula=Round(#PulseSoftMin#+#PulseSoftRange#*((Sin(Counter/12)+1)/2))
DynamicVariables=1

[MeasurePanelWashAlpha]
Measure=Calc
Formula=Round(#PanelWashMin#+#PanelWashRange#*((Sin(Counter/12)+1)/2))
DynamicVariables=1

[MeasurePulseRadius]
Measure=Calc
Formula=(#PulseRadiusBase#+#PulseRadiusRange#*((Sin(Counter/12)+1)/2))
DynamicVariables=1

[MeasureScanX]
Measure=Calc
Formula=(20+(Counter%340))

