[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,1
OnRefreshAction=[!SetVariable StatusText "SYNCING"][!SetVariable StatusColor "#ColorSync#"][!UpdateMeterGroup Dynamic][!Redraw][!CommandMeasure MeasureQuotaCommand "Run"]
ContextTitle=Edit all three concepts
ContextAction=["notepad.exe" "#@#Variables.inc"]
ContextTitle2=Refresh quota now
ContextAction2=[!CommandMeasure MeasureQuotaCommand "Run"]
ContextTitle3=Open concept folder
ContextAction3=["explorer.exe" "#CURRENTPATH#"]

[Metadata]
Name=Codex Quota - Blueprint HUD
Author=Codex Quota Monitor contributors
Information=Compact technical blueprint concept with a circular quota scope.
Version=1.2.0
License=MIT

[Variables]
@Include=#@#Variables.inc
QuotaRemaining=0
QuotaRemainingDisplay=--
QuotaUsed=--
QuotaWindow=--
QuotaReset=--
QuotaCountdown=WAITING
QuotaPlan=--
QuotaCredits=--
QuotaLimitId=CODEX
QuotaAux=PRIMARY LIMIT
LastUpdated=--:--:--
StatusText=STARTING
StatusColor=#ColorSync#
ProgressWidth=0
ProgressMaxWidth=139
ActiveAccentA=#BlueprintAccentA#
ActiveAccentB=#BlueprintAccentB#
ProgressColorA=#BlueprintAccentA#
ProgressColorB=#BlueprintAccentB#
ErrorText=

[MeasureQuotaCommand]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "#@#Scripts\Get-CodexQuota.ps1" -TimeoutMs #CommandTimeoutMs#
State=Hide
OutputType=UTF8
Timeout=(#CommandTimeoutMs#+3000)
FinishAction=[!CommandMeasure MeasureQuotaParser "Parse()"]
UpdateDivider=-1
DynamicVariables=1

[MeasureQuotaParser]
Measure=Script
ScriptFile=#@#Scripts\ParseQuota.lua
UpdateDivider=-1

[MeasureAutoRefresh]
Measure=Calc
Formula=Counter
IfCondition=(MeasureAutoRefresh > 0) && ((MeasureAutoRefresh % #RefreshSeconds#) = 0)
IfTrueAction=[!CommandMeasure MeasureQuotaCommand "Run"]
DynamicVariables=1

[MeterCard]
Meter=Shape
X=0
Y=0
Shape=Rectangle 1,1,302,182,10 | Fill LinearGradient CardGradient | Stroke LinearGradient EdgeGradient | StrokeWidth 1.1
Shape2=Rectangle 7,7,290,170,7 | Fill Color 4,31,74,54 | Stroke Color #BlueprintInner# | StrokeWidth 1
Shape3=Ellipse 73,91,62,62 | Fill RadialGradient ScopeGlow | StrokeWidth 0
CardGradient=125 | #BlueprintBackgroundA# ; 0.0 | #BlueprintBackgroundB# ; 0.52 | #BlueprintBackgroundC# ; 1.0
EdgeGradient=180 | #BlueprintAccentA# ; 0.0 | #BlueprintAccentB# ; 0.62 | #BlueprintAccentC# ; 1.0
ScopeGlow=0,0 | #BlueprintGlow# ; 0.0 | 31,124,225,0 ; 1.0
AntiAlias=1
DynamicVariables=1

